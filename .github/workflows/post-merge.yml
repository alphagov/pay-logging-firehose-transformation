name: Post Merge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

concurrency: transformation-post-merge

jobs:
  tests:
    uses: ./.github/workflows/_run-tests.yml

  tag-release:
    if: "contains(github.event.head_commit.message, '[automated release]')"
    needs:
      - tests
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@c1bed255fa76164f86f2b0f0f20df26ea58ab1c6
